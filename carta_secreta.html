<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6f3e3a">
  <title>Uma carta para você</title>

  <style>
    :root {
      --vinho: #6f3e3a;
      --vinho-escuro: #472724;
      --rosa: #d8aaa0;
      --papel: #fffaf0;
      --papel-escuro: #f3e6d4;
      --tinta: #3c2c29;
      --dourado: #b58a4b;
      --erro: #a32929;
      --sombra: rgba(45, 25, 20, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--tinta);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.30), transparent 28%),
        radial-gradient(circle at 84% 82%, rgba(255,255,255,.18), transparent 30%),
        linear-gradient(145deg, #9d6960 0%, #6f3e3a 48%, #422523 100%);
    }

    button, input {
      font: inherit;
    }

    .tela-senha {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .convite {
      width: min(100%, 610px);
      padding: clamp(30px, 6vw, 58px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 28px;
      background: rgba(255, 250, 240, .96);
      box-shadow: 0 28px 80px var(--sombra);
      animation: surgir .8s ease both;
    }

    .selo {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      color: #fff8ea;
      background: var(--vinho);
      box-shadow:
        0 8px 20px rgba(71,39,36,.30),
        inset 0 0 0 5px rgba(255,255,255,.09);
      font-size: 36px;
    }

    .convite h1 {
      margin: 0;
      color: var(--vinho);
      font-size: clamp(2.15rem, 7vw, 3.7rem);
      font-weight: 500;
      line-height: 1.08;
    }

    .convite p {
      max-width: 460px;
      margin: 18px auto 28px;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .formulario {
      display: flex;
      gap: 10px;
    }

    .formulario input {
      min-width: 0;
      flex: 1;
      padding: 15px 17px;
      border: 1px solid #caa99d;
      border-radius: 12px;
      outline: none;
      color: var(--tinta);
      background: #fffdfa;
      transition: .2s ease;
    }

    .formulario input:focus {
      border-color: var(--vinho);
      box-shadow: 0 0 0 4px rgba(111,62,58,.13);
    }

    .botao-principal {
      border: 0;
      border-radius: 12px;
      padding: 15px 22px;
      color: white;
      background: var(--vinho);
      cursor: pointer;
      font-weight: 700;
      transition: transform .18s ease, opacity .18s ease;
    }

    .botao-principal:hover {
      opacity: .94;
      transform: translateY(-1px);
    }

    .erro {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--erro);
      font-size: .96rem;
    }

    .erro.tremer {
      animation: tremer .35s ease;
    }

    .leitor {
      display: none;
      min-height: 100vh;
      padding: 20px;
    }

    .leitor.ativo {
      display: grid;
      place-items: center;
      animation: surgir .7s ease both;
    }

    .estrutura {
      width: min(100%, 1120px);
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .titulo-livro {
      margin: 0;
      color: rgba(255,255,255,.92);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 400;
      letter-spacing: .05em;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,.24);
    }

    .livro {
      position: relative;
      width: min(100%, 960px);
      height: min(74vh, 680px);
      min-height: 500px;
      perspective: 1800px;
      filter: drop-shadow(0 30px 34px rgba(28,14,12,.38));
    }

    .livro::before {
      content: "";
      position: absolute;
      inset: 2.5% -1.3% -2.5%;
      border-radius: 10px 20px 20px 10px;
      background: #3c201e;
      z-index: -2;
    }

    .livro::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 24px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(75,42,34,.17), transparent);
      pointer-events: none;
      z-index: 5;
    }

    .pagina {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
      padding: clamp(42px, 6vw, 72px) clamp(34px, 7vw, 86px) 52px;
      border-radius: 7px 17px 17px 7px;
      background:
        linear-gradient(90deg, rgba(181,138,75,.10), transparent 8%, transparent 92%, rgba(126,82,51,.06)),
        repeating-linear-gradient(0deg, rgba(100,70,45,.016) 0, rgba(100,70,45,.016) 1px, transparent 1px, transparent 4px),
        var(--papel);
      box-shadow:
        inset 18px 0 30px rgba(91,55,39,.07),
        inset -5px 0 12px rgba(91,55,39,.04);
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .pagina.visivel {
      display: block;
    }

    .pagina.medicao {
      display: block;
      visibility: hidden;
      pointer-events: none;
    }

    .pagina.virando-frente {
      animation: virarFrente .55s ease both;
    }

    .pagina.virando-tras {
      animation: virarTras .55s ease both;
    }

    .conteudo-pagina {
      height: 100%;
      overflow: hidden;
      white-space: pre-wrap;
      text-align: justify;
      hyphens: auto;
      font-size: clamp(.91rem, 1.55vw, 1.08rem);
      line-height: 1.72;
      letter-spacing: .005em;
    }

    .pagina:first-child .conteudo-pagina {
      font-size: clamp(1rem, 1.75vw, 1.16rem);
    }

    .numero-pagina {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      color: rgba(60,44,41,.58);
      font-size: .84rem;
      letter-spacing: .12em;
    }

    .controles {
      width: min(100%, 960px);
      display: grid;
      grid-template-columns: 140px 1fr 140px;
      align-items: center;
      gap: 12px;
    }

    .botao-pagina {
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: 11px 18px;
      color: white;
      background: rgba(255,255,255,.13);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: .18s ease;
    }

    .botao-pagina:hover:not(:disabled) {
      background: rgba(255,255,255,.22);
      transform: translateY(-1px);
    }

    .botao-pagina:disabled {
      opacity: .35;
      cursor: default;
    }

    .progresso-area {
      display: grid;
      gap: 7px;
      color: rgba(255,255,255,.9);
      text-align: center;
      font-size: .9rem;
    }

    .trilho {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.20);
    }

    .barra {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: rgba(255,255,255,.88);
      transition: width .3s ease;
    }

    .instrucao {
      margin: 0;
      color: rgba(255,255,255,.68);
      font-size: .82rem;
      text-align: center;
    }

    .fonte-oculta {
      position: fixed;
      left: -99999px;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      white-space: pre-wrap;
    }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tremer {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes virarFrente {
      0% { opacity: .45; transform: rotateY(-10deg) translateX(18px); }
      100% { opacity: 1; transform: rotateY(0) translateX(0); }
    }

    @keyframes virarTras {
      0% { opacity: .45; transform: rotateY(10deg) translateX(-18px); }
      100% { opacity: 1; transform: rotateY(0) translateX(0); }
    }

    @media (max-width: 700px) {
      .formulario {
        flex-direction: column;
      }

      .livro {
        height: 72vh;
        min-height: 480px;
      }

      .livro::after {
        display: none;
      }

      .pagina {
        padding: 36px 26px 46px;
        border-radius: 6px 13px 13px 6px;
      }

      .conteudo-pagina {
        text-align: left;
        font-size: clamp(.87rem, 3.55vw, 1rem);
        line-height: 1.62;
      }

      .controles {
        grid-template-columns: 1fr 1fr;
      }

      .progresso-area {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .botao-pagina {
        width: 100%;
      }
    }

    @media (max-height: 650px) {
      .leitor {
        padding: 10px;
      }

      .livro {
        height: 76vh;
        min-height: 400px;
      }

      .pagina {
        padding-top: 30px;
        padding-bottom: 42px;
      }

      .instrucao {
        display: none;
      }
    }
  </style>
</head>

<body>
  <section class="tela-senha" id="telaSenha">
    <div class="convite">
      <div class="selo" aria-hidden="true">✦</div>
      <h1>Uma carta para você</h1>
      <p>
        Existe uma frase capaz de abrir este pequeno livro.
        Escreva-a abaixo para começar a leitura.
      </p>

      <form class="formulario" id="formularioSenha">
        <input
          id="campoSenha"
          type="password"
          placeholder="Digite a frase-chave"
          autocomplete="off"
          aria-label="Frase-chave"
        >
        <button class="botao-principal" type="submit">Abrir o livro</button>
      </form>

      <p class="erro" id="mensagemErro" aria-live="polite"></p>
    </div>
  </section>

  <main class="leitor" id="leitor" aria-hidden="true">
    <div class="estrutura">
      <h2 class="titulo-livro">Para a pessoa que eu mais amei</h2>

      <section class="livro" id="livro" aria-label="Carta em formato de livro"></section>

      <nav class="controles" aria-label="Navegação das páginas">
        <button class="botao-pagina" id="anterior" type="button" aria-label="Página anterior">← Anterior</button>

        <div class="progresso-area">
          <span id="indicador">Página 1 de 1</span>
          <div class="trilho" aria-hidden="true">
            <div class="barra" id="barra"></div>
          </div>
        </div>

        <button class="botao-pagina" id="proxima" type="button" aria-label="Próxima página">Próxima →</button>
      </nav>

      <p class="instrucao">Use os botões, as setas do teclado ou deslize a página no celular.</p>
    </div>
  </main>

  <div class="fonte-oculta" id="textoIntegral"></div>

  <script>
    const FRASE_SECRETA = "cada trecho da nossa história é parte do mais belo poema que esse mundo sonhou em ler";
    const TEXTO_DA_CARTA = "Para a pessoa que eu mais amei\nO que dizer a essa altura que já não tenha sido dito de todas as formas em cinco anos? \n\nEu tenho muito essa mania de achar que as coisas mais belas são as mais estravagantes, desde comparar você a uma estrela, até escrever uma história pra dizer que te esperava sem saber, escrever um folhetim de poesias e afins, mas agora acho que quero ser bem mais direto. Respondendo minha própria pergunta, vou escrever essa carta de um jeito que nos cinco anos tive coragem poucas vezes de fazer: com sinceridade. Não que minhas palavras anteriores não tenham sido sinceras, longe disso, mas enquanto escrevo essa carta eu estou escutando “Oração” e cara... eu furacão de memórias, de lembranças, de sonhos e esperanças, realidade boas e ruins, vividas em seu extremo e todas de uma vez a cada verso, seja eu escutando pra lembrar de você, seja cantando pra expressar meu carinho pra você. E deles vou roubar a frase “coração não é tão simples quanto pensa” e realmente não é, mas nessa carta vou tentar simplificar o meu. Veja então essas charadinhas pra chegar até essa carta como a chave pra minha carta mais sincera e direta nesse tempo. \nTe conhecer foi uma tempestade perfeita na minha vida, na raiz da expressão. Não esperava me apaixonar, não naquele momento, isso eu já disse diversas vezes, mas sem a sinceridade pra terminar a frase. Não esperava me apaixonar, mas desejando estar errado, completamente errado. Sendo verdadeiro sobre mim, não eu não sou nem nunca fui pegador, odeio que me preguem como nerd, como se tivesse sorte por ter você, porque se não fosse você eu não teria ninguém, e nesse ódio eu gosto de dizer pra mim mesmo que eu roubei seu coração na época que ia viver minha vida como um “homem” deve viver, mas a real? Eu nunca quis viver essa vida, essa coisa fria de ficar sem amar, eu escolhi esperar pra perder a virgindade com alguem com quem eu pudesse dar um tempo antes e depois rindo atoa, esperei porque queria ter o tempo pra aproveitar a pessoa ao máximo, poxa não foi só um por acaso, eu realmente quis que fosse com você porque queria que você fosse essa pessoa. Se não tivéssemos nos conectado, eu acho que não teria evoluído e eu digo o contrário disso pra todo mundo, pra você e até pra mim mesmo, mas vamos colocar os pingos nos “Is”... eu nunca fui pegador, nunca fui mlk piranha e naquela época já flertava com você querendo muito mais do que achei que você estaria disposta a me entregar : tempo. \nE aqui vem a espiral de momentos e lembranças, grandes e pequenas, que eu transformei em 11 tirinhas de perguntas, mas que na real é impossível resumir. “Cada trecho da nossa história é parte do mais lindo poema que esse mundo sonhou em ler”... é uma frase que traduz minha visão olhando pra soma desses momentos, olha quanta coisa linda, quantos lados, histórias, sensações, sentimentos, o que eu vivi com você... eu nunca mais vou viver com ninguém independente do que aconteça. Eu deixei o RPG de fora de propósito, porque acho essa parte da nossa história linda, mas eu quero focar no que está fora dele, nas outras coisas, porque acho cada uma dessas pessoas fascinantes, Ancor, Diana, Gabi, Ayleen, Gadrell, Minji...Aélis, ai Aélis, ou Thaélis, ou Charlotte... eu nunca soube dizer se eu amo ela por ser a mais parecida com você ou por ser onde você guardou traços lindos seus que as vezes só eu vejo... mas a real é que... a que eu mais amo dentre todos eles, ainda não se compara com o quanto você, Flávia Nicácio Gomes de Oliveira, a mulher com quem dividi os anos mais importantes da minha vida até agora... as vezes meu fascínio por você fica perdido no meio de tanta poesia então... vou tentar deixar ele mais concreto aqui. \nMeu fascínio vem nos olhos brilhantes ao acordar, ao sorriso tímido quando alguem elogia, as lágrimas tenras quando algo emociona... vem da feminidade sem forçar, da energia sem falsidade, da vontade! Deus como eu amo, sua vontade de fazer, de estar, de ser! Eu me emociono com a sua estada em cada momento porque eu... eu tenho tanta dificuldade de estar, que você me deixa alegre só por tentar me trazer... eu amo como sua voz oscila de tom com cada humor, amo ter milhares de versões suas e que todas são você. Amo ter vivido esses anos, esses momentos, de despertar em você a alegria que me deixa alegre por alegrar, a alegria que me deixa alegre por ser eu... isso é tão fundamental e tão raro de acontecer. Por tudo isso, me sinto sortudo em ter você, por ter tantas coisas que me despertam a alegria de ficar, a alegria de viver, a alegria de ser. Eu sei quem eu sou, sei dos meus defeitos e limitações, mas não me sinto coitado nem nenhuma poha desse gênero, me sinto pronto pra batalhar contra mim mesmo pra ser o melhor que eu posso a cada dia, e você é uma parte forte da minha motivação pra isso. \nNão seria uma carta sincera se eu não delineasse esses anos de relação com minha visão... e eu absolutamente gosto dela como um todo, porque convenhamos, perfeição demais não leva ninguém a lugar nenhum. Eu entrei nessa relação com 18 anos... é evidente que eu não tava pronto, uma garota completa e complexa, não um namoro de colégio, mas alguém que teve a atitude de conversar no dia 0 comigo sobre filhos, alguém que me trouxe um histórico de relações que eu teria que dobrar e aprender com, pra não errar nas coisas mais idiotas, pra não pisar em cicatrizes ainda frágeis, alguem encarando transições importantes, que me desafiaria a ser uma versão melhor de mim a cada vez, que me faria correr atrás de saber o que é ser um adulto de verdade, arcar com decisões emocionais de forma empática... alguém que trouxe consigo uma vida que eu reneguei, uma lista de experiências que eu abri mão de viver, alguem que me faria entender quem eu quero ser depois dessas escolhas, que não sou escravo do meu passado, e muito menos do meu suposto futuro, que me mostrou mesmo sem saber que a diferença a ser feita é sempre no presente. Foram muitas coisas, desde as brigas simples e bobas como o League of Legends, que no fundo me deixava com medo de não ser interessante o suficiente, me deixava inseguro por ter pessoas mais conectadas com você do que eu era em algum sentido... e assim foram muitas brigas mais. Mas também tiveram brigas mais sérias, nunca vou me esquecer de como senti que não tinha valor quando você se recusou a deixar o Rafael no seu passado... ou mesmo quando você voltou pro servidor, onde eu fui muito magoado. No fundo, eu me sinto inseguro com pessoas, não necessariamente fisicamente, mas emocionalmente mesmo. Da mais séria a mais boba, a raiz é a mesma... tem muita gente que pensa o pior de mim, que não vai com a minha cara ou com meu jeito, muita gente por ai que ainda vai achar que você precisa e merece alguem de outros gabaritos, e eu não sou esse posso de confiança pra encarar tudo isso de peito aberto, Deus é testemunha de como foi difícil escrever uma simples mensagem pra Poli... de como é difícil viver essa competição silenciosa... mas é uma cruz imensamente pequena perto do que vem de bom. \nPorque a sinceridade também passar por coisas boas que eu nunca disse, afinal, sou conhecido pelo morde e assopra nas minhas reflexões rs. Mas tem o que precisa ser dito aqui... eu nunca pensei que seria tão difícil imaginar meu dia sem você. É um exercício simples de mentalização, e ele me fez chorar dezenas de vezes ao longo dos anos, e aqui não vou esmiuçar a questão do medo de te perder pra sempre... porque essa é uma coisa sobre a qual não me cabe aprofundar agora, no auge da minha alegria de te ver perseverando mesmo com dias difíceis, mas basta dizer que já voltei nesses pontos quando achei que terminaríamos e nos outros momentos todos. E a real é que... nossa... eu perderia tantas coisas. As coisas mais bestas, o gesto de mandar s figurinhas, o carinho de me desejar cuidado ao ir e vir, a alegria perceptível quando eu começo a responder mais rápido, os pequenos gestos de lembrança, como os memes, as histórias, as fofocas... mas acima de tudo, eu não conseguiria viver sem alguem que se importa se eu to respondendo ou não... porque por mais que eu reclame da falta de paciência, nossa.... cada vez que eu leio você mandar um simples “amor?”, “baby?” ou a fatídica figurinha do “me ignora mesmo” eu choro de alegria em silêncio... porque dos meus medos, o de ficar sozinho é o pior e mais difícil de lidar... porque a solidão não é só não ter ninguém... é a indiferença. E esse é um ponto que eu sinto que você nunca vai entender porque, por mais que você como todo mundo sente solidão, você se torna necessária pras pessoas numa velocidade assustadora... e eu amo isso em você, invejo isso em você e quero ser assim como você, espero ansiosamente o dia em que eu vou aprender o segredo disso porque... porque teve o tempo na minha vida em que essa indiferença imperou e eu... não gosto e não quero me lembrar de como era sensação. Então é... eu me sinto egoisticamente muito alegre por você sentir minha ausência, por eu fazer diferença no seu dia... é algo pra além do que eu gosto de admitir. \nNessa linha de sinceridade, teve muitas coisas pequenas e grandes que me fizeram chegar tão longe e ainda te amar do tanto que eu amo... e vou ser visceralmente obsceno agora, nossa, mas como você é gostosa!  E eu não falo só das suas curvas, do quanto você é linda, ou do seu gosto que é suficiente pro meu pau ficar duro escrevendo sobre ele, mas no sentido total da palavra, ela combina com você. Sua voz é gostosa, seu calor é gostoso, suas palavras são gostosas, seu jeitinho de ser, a forma de agir e de pensar, de dar carinho e de ficar de boa, de ser explosiva no sexo e de se resguardar, tudo é extremamente gostoso. Eu já falei de como é fácil transar com você, como parece ser certo, como você me fez sair de achar que eu talvez fosse meio assexual, pra ter desejos profundos e insaciáveis. Eu tento ao máximo me envolver quando nós fazemos cenas com outras pessoas ali no nosso lugar, mas poha eu tenho que ser sincero, tirando os personagens que tem pau (que de fato fica mais fácil de crer em cena), qualquer personagem comparado a você é uma grande perda... com você é muito mais delicioso, eu me sinto muito mais eu transando com você...  cada fetiche, cada experiência, cada detalhe novo, cada oficina testada e que eu ainda quero testar, minha vontade é pelo menos 35% você, cairia isso OU MAIS se fosse pra praticar com qualquer outra pessoa... você é minha, dona do meu desejo e sabe disso, e espero que nunca esqueça independente do que aconteça. \nCresci me recusando a acreditar completamente no amor. Me perdi tentando ser o que não era pra viver um amor imbecil na adolescência, me perdi por não saber lidar com minha própria vontade de ser uma pessoa mais simples, coisa que não sou. E nessa eu prevaleceria sem ser contestado... contestado por uma mulher que também não é simples, mas que colocando minha não simplicidade contra a dela, os espaços se preenchem e nos sentimos mais nós, e aí eu comecei a acreditar naquela baboseira toda de amor de novo. É isso aí que eu ganho, uma identidade completa, nós crêssemos, eu não sou o mesmo que era sem você e você não é a mesma que era sem mim, isso incomodou alguns ao seu redor? EU QUERO QUE SE FODA, porque essa versão nossas juntos, pra mim, é a melhor versão. E não porque você se desdobrou pra me agradar, porque me deixou triste quando você sentiu que precisava fazer isso. Eu digo isso porque, nesses últimos 2 anos ao menos, eu senti que você era mais feliz nessa nova versão, que podia ser mais como você é, sincera sobre o que quer e o que não quer. Escolhi aqueles enigmas porque eles mostram um pouco da nossa evolução. Os dois primeiros, me lembrar de como as coisas começaram simples, como era uma explosão de sentimentos, de interesses em comum, mas especialmente um interesse em se conhecer desesperadamente, aprender mais sobre o outro naquele ponto. A terceira e a quarta já mostram nossa construção jun     const telaSenha = document.getElementById("telaSenha");
    const leitor = document.getElementById("leitor");
    const formulario = document.getElementById("formularioSenha");
    const campoSenha = document.getElementById("campoSenha");
    const mensagemErro = document.getElementById("mensagemErro");
    const livro = document.getElementById("livro");
    const anterior = document.getElementById("anterior");
    const proxima = document.getElementById("proxima");
    const indicador = document.getElementById("indicador");
    const barra = document.getElementById("barra");

    let paginas = [];
    let paginaAtual = 0;
    let temporizadorRedimensionamento;
    let toqueInicialX = null;

    function normalizar(texto) {
      return texto
        .trim()
        .toLocaleLowerCase("pt-BR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
    }

    function criarPagina() {
      const pagina = document.createElement("article");
      pagina.className = "pagina medicao";

      const conteudo = document.createElement("div");
      conteudo.className = "conteudo-pagina";

      const numero = document.createElement("span");
      numero.className = "numero-pagina";

      pagina.append(conteudo, numero);
      livro.appendChild(pagina);

      return { pagina, conteudo, numero };
    }

    function paginaTransbordou(elemento) {
      return elemento.scrollHeight > elemento.clientHeight + 1;
    }

    function paginarCarta() {
      const posicaoRelativa = paginas.length > 1
        ? paginaAtual / (paginas.length - 1)
        : 0;

      livro.innerHTML = "";
      paginas = [];
      paginaAtual = 0;

      const partes = TEXTO_DA_CARTA.match(/\S+|\s+/g) || [];
      let indice = 0;

      while (indice < partes.length) {
        const elementos = criarPagina();
        let conteudoDaPagina = "";

        while (indice < partes.length) {
          const candidato = conteudoDaPagina + partes[indice];
          elementos.conteudo.textContent = candidato;

          if (paginaTransbordou(elementos.conteudo) && conteudoDaPagina.length > 0) {
            elementos.conteudo.textContent = conteudoDaPagina;
            break;
          }

          conteudoDaPagina = candidato;
          indice++;
        }

        paginas.push(elementos);

        if (!conteudoDaPagina && indice < partes.length) {
          elementos.conteudo.textContent = partes[indice];
          indice++;
        }
      }

      paginas.forEach((item, indicePagina) => {
        item.numero.textContent = String(indicePagina + 1);
        item.pagina.classList.remove("medicao");
      });

      paginaAtual = Math.min(
        paginas.length - 1,
        Math.round(posicaoRelativa * Math.max(0, paginas.length - 1))
      );

      mostrarPagina(paginaAtual, false);
    }

    function mostrarPagina(indice, animar = true, direcao = 1) {
      if (!paginas.length) return;

      paginaAtual = Math.max(0, Math.min(indice, paginas.length - 1));

      paginas.forEach((item, i) => {
        item.pagina.classList.remove(
          "visivel",
          "virando-frente",
          "virando-tras"
        );

        if (i === paginaAtual) {
          item.pagina.classList.add("visivel");

          if (animar) {
            item.pagina.classList.add(
              direcao >= 0 ? "virando-frente" : "virando-tras"
            );
          }
        }
      });

      anterior.disabled = paginaAtual === 0;
      proxima.disabled = paginaAtual === paginas.length - 1;

      indicador.textContent =
        `Página ${paginaAtual + 1} de ${paginas.length}`;

      barra.style.width =
        `${((paginaAtual + 1) / paginas.length) * 100}%`;
    }

    function avancar() {
      if (paginaAtual < paginas.length - 1) {
        mostrarPagina(paginaAtual + 1, true, 1);
      }
    }

    function voltar() {
      if (paginaAtual > 0) {
        mostrarPagina(paginaAtual - 1, true, -1);
      }
    }

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      if (normalizar(campoSenha.value) === normalizar(FRASE_SECRETA)) {
        mensagemErro.textContent = "";
        telaSenha.style.display = "none";
        leitor.classList.add("ativo");
        leitor.setAttribute("aria-hidden", "false");
        document.title = "Uma carta para você";

        requestAnimationFrame(() => {
          paginarCarta();
          leitor.focus();
        });

        return;
      }

      mensagemErro.textContent =
        "Essa não é a frase correta. Você pode tentar novamente.";

      mensagemErro.classList.remove("tremer");
      void mensagemErro.offsetWidth;
      mensagemErro.classList.add("tremer");

      campoSenha.select();
      campoSenha.focus();
    });

    anterior.addEventListener("click", (evento) => {
      evento.preventDefault();
      voltar();
    });

    proxima.addEventListener("click", (evento) => {
      evento.preventDefault();
      avancar();
    });

    document.addEventListener("keydown", (evento) => {
      if (!leitor.classList.contains("ativo")) return;

      if (evento.key === "ArrowRight" || evento.key === "PageDown") {
        avancar();
      }

      if (evento.key === "ArrowLeft" || evento.key === "PageUp") {
        voltar();
      }
    });

    livro.addEventListener("touchstart", (evento) => {
      toqueInicialX = evento.changedTouches[0].clientX;
    }, { passive: true });

    livro.addEventListener("touchend", (evento) => {
      if (toqueInicialX === null) return;

      const deslocamento =
        evento.changedTouches[0].clientX - toqueInicialX;

      if (Math.abs(deslocamento) > 55) {
        deslocamento < 0 ? avancar() : voltar();
      }

      toqueInicialX = null;
    }, { passive: true });

    window.addEventListener("resize", () => {
      if (!leitor.classList.contains("ativo")) return;

      clearTimeout(temporizadorRedimensionamento);
      temporizadorRedimensionamento = setTimeout(paginarCarta, 180);
    });
  </script>
